rt Einstein','The best way out is always through.|Robert Frost','We are what we repeatedly do. Excellence, then, is not an act, but a habit.|Will Durant','Well begun is half done.|Aristote','The only thing we have to fear is fear itself.|Franklin D. Roosevelt','Do what you can, with what you have, where you are.|Theodore Roosevelt','Courage is grace under pressure.|Ernest Hemingway','It is not death that a man should fear, but never beginning to live.|Marc Aurèle','Fall seven times, stand up eight.|Proverbe japonais','The best way to predict the future is to invent it.|Alan Kay','Hard work beats talent when talent doesn’t work hard.|Tim Notke','You miss 100% of the shots you don’t take.|Wayne Gretzky','It’s not whether you get knocked down, it’s whether you get up.|Vince Lombardi','Run when you can, walk if you have to, crawl if you must; just never give up.|Dean Karnazes','The miracle isn’t that I finished. The miracle is that I had the courage to start.|John Bingham','Everything you’ve ever wanted is on the other side of fear.|George Addair','Not all those who wander are lost.|J.R.R. Tolkien','It does not do to dwell on dreams and forget to live.|J.K. Rowling','I am not afraid of storms, for I am learning how to sail my ship.|Louisa May Alcott','Every child is an artist. The problem is how to remain an artist once we grow up.|Pablo Picasso','Creativity takes courage.|Henri Matisse','Great things are done by a series of small things brought together.|Vincent van Gogh','We are made of star-stuff.|Carl Sagan','If I have seen further, it is by standing on the shoulders of giants.|Isaac Newton','Ce n’est pas parce que les choses sont difficiles que nous n’osons pas, c’est parce que nous n’osons pas qu’elles sont difficiles.|Sénèque','Vivre, c’est naître lentement.|Saint-Exupéry','Il n’y a pas de hasard, il n’y a que des rendez-vous.|Paul Éluard','Un jour sans rire est un jour perdu.|Chamfort','L’art est le plus court chemin de l’homme à l’homme.|André Malraux','Après l let S={days:{},dates:[],vac:[],g:{m:[],j:[],a:[]}};
try{const r=localStorage.getItem('edt');if(r)Object.assign(S,JSON.parse(r))}catch(e){}
S.g=Object.assign({m:[],j:[],a:[],p:[],c:[]},S.g||{});S.vac=S.vac||[];S.dates=S.dates||[];S.days=S.days||{};

const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114;return new Date(y,Math.floor(n/31)-1,n%31+1)}

function grid(y,m,mini){
  const start=mon(new Date(y,m,1)),last=new Date(y,m+1,0),H=HOL(y);
  let h='<div class="g'+(mini?' mini':'')+'"><b></b>'+'LMMJVSD'.split('').map(x=>'<b>'+x+'</b>').join('');

function catItems(cat,y,m,yr){

const pl=r=>{let p=r&&(r.payload!==undefined?r.payload:r.structuredContent);if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){}}return p};
async function loadWx(){

        if(!lk){if(box.isConnected)box.textContent='Ville introuvable : '+city;return}LK[city]=lk}
      loc=WX[city]=pl(await mcp.callTool(SRV,'widgets-daily-claude',{queryParams:{locationKey:lk,unit:'metric',lang:'fr'}}));
    }
    if(!box.isConnected)return;
    const f=((loc&&loc.dailyForecast)||[]).find(x=>(x.date||'').slice(0,10)===k);

    box.style.color='var(--tx)';box.style.fontSize='16px';
    box.innerHTML='<div style="display:flex;align-items:center;gap:14px"><div style="font-size:44px;line-height:1">'+wxi(d.icon)+'</div><div style="flex:1"><div style="font-size:26px;font-weight:700">'+esc(d.displayTemperature)+' <span style="font-size:17px;color:var(--mu);font-weight:500">/ '+esc(n.displayTemperature)+'</span></div><div style="color:var(--mu);font-size:14px">'+esc(d.phrase)+'</div></div></div><div style="margin-top:10px">'+tg('🌧️ '+d.rainProbability)+tg('Ressenti '+d.realFeel)+(ex.wind?tg('💨 '+ex.wind):'')+(ex.uv?tg('UV '+ex.uv.value):'')+'</div>'+al.map(a=>'<span class="chip" style="--c:#ff9500;margin-top:8px">⚠️ '+esc(a.alertName+' '+a.alertDescription)+'</span>').join('')+'<div style="color:var(--mu);font-size:12px;margin-top:8px">AccuWeather</div>';
  }catch(e){
    if(!box.isConnected)return;

    box.textContent=c==='server_not_connected'?'AccuWeather n’est pas connecté à ton compte Claude.':(c==='approval_required'||c==='blocked_by_policy'||c==='needs_reauth')?'Autorisation requise pour afficher la météo : ouvre la page dans Claude et accepte.':'Météo momentanément indisponible.';
  }
}

const fdate=k=>k.slice(8)+'/'+k.slice(5,7)+'/'+k.slice(2,4);
function searchHTML(q){
  q=nz(q).trim();if(q.length<2)return '<div class="em">Tapez au moins 2 lettres</div>';
  const R=[],hit=(...a)=>nz(a.join(' ')).includes(q);
  Object.keys(S.days).sort().forEach(k=>{const d=S.days[k];
    d.r.forEach(x=>{if(hit(x.x,x.l,x.nt,x.pr,x.du,x.c,x.who))R.push({k,c:x.c,g:x.c,t:(x.h?x.h+' ':'')+x.x+(x.l?' · '+x.l:'')})});
    d.t.forEach(x=>{if(hit(x.x))R.push({k,c:'Tâche',g:'Tâche',t:x.x})});
    if(d.n&&hit(d.n))R.push({k,c:'Autre',g:'Note',t:d.n.slice(0,90)});
    (d.w||[]).forEach(x=>{if(hit(x.nt))R.push({k,c:'Job',g:'Travail',t:x.nt})});
    const g=d.pg;if(g&&hit(g.m,g.a,g.s))R.push({k,c:'Vacances',g:'Programme',t:[g.m,g.a,g.s].filter(Boolean).join(' · ').slice(0,90)});
  });
  S.dates.forEach(x=>{if(hit(x.n))R.push({k:x.d,c:'Date',g:x.rec?'Anniversaire':'Date',t:x.n})});
  S.vac.forEach(x=>{if(hit(x.l,'vacances'))R.push({k:x.a,c:'Vacances',g:'Vacances',t:(x.l||'Vacances')+' · '+fdate(x.a)+' → '+fdate(x.b)})});
  GT.forEach(([f,n])=>(S.g[f]||[]).forEach(x=>{if(hit(x.x))R.push({k:'',c:n,g:'À faire',t:x.x})}));
  if(!R.length)return '<div class="em">Aucun résultat</div>';
  return R.slice(0,80).map(r=>'<button class="it c" data-a="'+(r.k?'day':'tab')+'" '+(r.k?'data-d="'+r.k+'"':'data-t="todo"')+' style="--c:'+(C[r.c]||'#8e8e93')+';width:100%"><span class="tm" style="min-width:68px;color:var(--mu)">'+(r.k?fdate(r.k):'—')+'</span><span class="t">'+esc(r.t)+'</span><span class="tag">'+r.g+'</span></button>').join('');
}
function vRech(){return '<h1>Recherche</h1><p class="sub">Rendez-vous, tâches, notes, lieux, dates…</p><div class="card"><input type="search" id="sq" placeholder="Rechercher" value="'+esc(V.q||'')+'" style="width:100%;background:var(--bg);border:0;border-radius:10px;padding:10px 12px;outline:none"></div><div class="card" id="sr">'+searchHTML(V.q||'')+'</div>'}

let dbDocs=null,dbT=null;const PUSHED={};
async function dbPush(){
