/* ===== Affinage du design ===== */
html,body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
:root{--sh:0 1px 2px rgba(0,0,0,.04),0 0 0 .5px rgba(0,0,0,.05);--tint:color-mix(in srgb,var(--c,var(--ac)) 11%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh:0 0 0 .5px rgba(255,255,255,.06)}}
h1{font-size:27px;font-weight:700;letter-spacing:-.6px}
.sub{font-size:13.5px}
.card{border-radius:16px;padding:14px 16px;box-shadow:var(--sh)}
.card h2{font-size:12px;font-weight:600;letter-spacing:.45px;margin-bottom:10px}
.it{padding:10px 0;border-bottom:.5px solid var(--ln)}
.nv button{font-size:20px}.nv .td{font-size:15px;font-weight:500}
/* boutons : teintés et discrets au lieu de pleins */
.add{gap:8px;align-items:center}
.add button,.btn{background:var(--tint);color:var(--c,var(--ac));border-radius:10px;padding:8px 14px;min-height:38px;font-size:15px;font-weight:600;transition:opacity .15s,transform .1s}
.add button:active,.btn:active,.evg>button:active,.ev .ea>button:active{opacity:.6;transform:scale(.98)}
.add input,.add select,.nt{border-radius:10px;padding:9px 12px;min-height:38px}
.add input[type=text]{font-size:16px}
textarea{border-radius:12px}
.plus{width:24px;height:24px;font-size:16px;font-weight:500;background:var(--tint);color:var(--ac)}
/* pastilles et étiquettes plus fines */
.chip{padding:3px 9px;font-size:13px;border-radius:8px;margin:0 5px 6px 0}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:500}
.ck{width:20px;height:20px;border-width:1.5px}
.x{font-size:18px;opacity:.7}
/* événements */
.ev{background:color-mix(in srgb,var(--c) 5%,var(--card));border-left-width:3px;border-radius:10px;padding:10px 12px}
.ev .ea{gap:6px}
.ev .ea>button,.ev .ea>label{background:color-mix(in srgb,var(--c,var(--ac)) 8%,var(--card));min-height:34px;font-size:13.5px;font-weight:500;border-radius:9px}
.ev .ea .del{width:40px;font-size:15px}
.evg>button,.evg>label{min-height:40px;font-size:14px;font-weight:500;border-radius:10px}
.evg .pri{background:var(--ac);color:#fff}
.ef .fb button{min-height:42px;border-radius:11px}
/* formulaires dans les événements */
.ev .add button{padding:6px 12px;min-height:34px;font-size:14px}
.ev .add input{min-height:34px;padding:7px 10px}
/* boutons de la sauvegarde et du compte */
[data-bkx],[data-acc="cfg"]{background:var(--tint)!important;color:var(--ac)!important;font-weight:600}
[data-acc="out"]{background:color-mix(in srgb,#ff3b30 10%,transparent)!important}
/* barre d'onglets */
nav{border-top:.5px solid var(--ln);padding-top:5px}
nav button{font-size:10px;font-weight:500;gap:1px;padding:3px 0}
nav button i{display:flex;height:26px;align-items:center}
nav button i svg{width:24px;height:24px}
nav .on i svg{stroke-width:2.1}
/* écran de connexion */
.af input{box-shadow:var(--sh)}
.af .pri{border-radius:12px;padding:13px;font-weight:600}

/* ===== Onglet À faire : tâches et notes ===== */
.gbody .tk>.it{align-items:flex-start}.gbody .tk>.it .ck{margin-top:1px}.gbody .tk>.it .opt2,.gbody .tk>.it>.x{margin-top:-4px}
.gbody .tt{font-weight:600;font-size:16px;line-height:1.3;letter-spacing:-.1px}
.gbody .it.done .tt,.gbody .it.cx .tt{font-weight:500}
.tnd{display:block;margin-top:4px;font-weight:400;font-size:14.5px;line-height:1.45;color:color-mix(in srgb,var(--tx) 72%,transparent);white-space:pre-wrap;word-break:break-word}
.it.done .tnd{color:var(--mu)}
.gbody .tk{padding:2px 0}
.gbody .tp{padding:2px 0 12px 32px}
textarea.tna{display:block;width:100%;min-height:0;resize:none;font-size:16px;line-height:1.45;padding:10px 12px;border-radius:12px;background:var(--bg);overflow:hidden}
.tadd{flex-direction:column;align-items:stretch;gap:8px;margin-top:12px;padding-top:12px;border-top:.5px solid var(--ln)}
.tadd input[type=text]{width:100%;font-weight:600}
.tadd textarea.tna{font-size:16px}
.tadd button{align-self:flex-end}
.gnote .sub{color:var(--tx)!important;font-size:13px}

/* bouton partager */
.evg .evcl{grid-column:1/-1}
.ev .ea .shr2{flex:none;width:44px;color:var(--ac)}

/* ===== Cartes du planning repliables ===== */
.ev .eh{cursor:pointer}
.evt{flex:none;align-self:flex-start;display:flex;align-items:center;gap:3px;color:var(--c,var(--ac));font-size:13px;font-weight:600;padding:4px 2px 4px 8px}
.evt .chv{display:inline-block;transform:rotate(90deg);transition:transform .2s;font-size:15px}.evt .chv.up{transform:rotate(-90deg)}
.ev:not(.open){padding:10px 12px}
.ev.open .eb{border-top:.5px solid color-mix(in srgb,var(--c) 25%,transparent);margin-top:10px;padding-top:10px}
.itin{margin-top:10px}.itl{font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.itb{display:flex;gap:6px;flex-wrap:wrap}
.itc{display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--ac) 10%,var(--card));color:var(--ac);border-radius:9px;padding:7px 11px;font-size:13.5px;font-weight:600;text-decoration:none}
.hmc{font-size:12.5px;color:var(--mu);margin-top:6px}.hmc button{color:var(--ac);font-size:12.5px}
.hms{display:flex;flex-direction:column;margin-top:4px;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:var(--sh)}
.hms:empty{display:none}
.hms button{text-align:left;padding:10px 12px;font-size:14px;border-bottom:.5px solid var(--ln)}.hms button:last-child{border:0}
.hms button:active{background:var(--bg)}

/* ===== Épuration ===== */
.ev,.ev.open{background:var(--card);box-shadow:var(--sh);border-left-width:3px}
.ev:not(.open){padding:11px 12px}
.ev .tm{font-weight:600}
.ev .ec{font-size:10.5px;letter-spacing:.7px;font-weight:600}
.ev .em2{font-size:13.5px}
.ev .ea>button,.ev .ea>label{background:var(--bg);color:var(--tx);font-weight:500}
.ev .ea .del{color:#ff3b30}.ev .ea .shr2{color:var(--tx)}
.ev .ea svg{vertical-align:-3px}
.tag{background:none!important;padding:0 2px;font-size:10.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.chip{background:none;border:.5px solid color-mix(in srgb,var(--c) 40%,transparent);color:var(--c);font-weight:500}
.itc{background:none;padding:4px 0;margin-right:14px;font-size:14px}
.gh .ic,.gtile .ic{background:color-mix(in srgb,var(--c) 10%,transparent);color:var(--c)}
.gh .ic svg,.gtile .ic svg{display:block}
.it.c,.ev{border-left-color:var(--c)}
#wxb [style*="font-size:44px"]{font-size:32px!important}
.cl{font-size:12.5px}.cl a{text-decoration:none;font-weight:500}
.mp a{text-decoration:none}
.card h2{color:var(--mu)}
.card[style*="--c"] h2{color:var(--c,var(--mu))}
.ndot{width:6px;height:6px;border-radius:50%;background:var(--mu);margin:0 4px;flex:none}

.hms{flex:1 1 100%;width:100%}
.hms button{display:flex;flex-direction:column;gap:1px;width:100%}
.hms button b{font-weight:600;font-size:14.5px;color:var(--tx)}
.hms button span{font-size:12.5px;color:var(--mu)}
.add .hms button,.hms button{background:none!important;color:var(--tx);border-radius:0;min-height:0;padding:10px 12px;font-weight:400;text-align:left;align-items:flex-start}
.hms{border:.5px solid var(--ln)}

/* ===== Planning : même alignement que la ligne Travail ===== */
.ev,.ev.open{background:none!important;box-shadow:none!important;border-radius:2px;margin:6px 0;padding:9px 0 9px 10px!important;border-left:3px solid var(--c);border-bottom:1px solid var(--ln)}
.ev .eh .tm{font-size:16px;font-weight:700;min-width:46px;line-height:1.35}
.ev .eh{gap:10px}
.ev.open .eb{border-top:0;margin-top:10px;padding-top:0}
.ev .ea{margin-top:10px}
/* ===== Groupe de lignes (lieu, itinéraire, calendrier) ===== */
.grp{background:var(--bg);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 14px;color:var(--tx);text-decoration:none;font-size:15px;border-bottom:.5px solid var(--ln);text-align:left;background:none}
.row:last-child{border-bottom:0}
.row .ri{flex:none;color:var(--mu)}
.row .rl{flex:1;min-width:0;color:var(--tx)}
.row .rc{color:var(--mu);font-size:20px;line-height:1}
.row .rr{flex:none;display:flex;gap:14px;color:var(--ac);font-size:14px;font-weight:500}
.row .rr a{color:var(--ac);text-decoration:none}
.row .rlk{display:flex;align-items:center;gap:12px;text-decoration:none;padding:9px 0}
.row .rlk small{display:block;color:var(--mu);font-size:12.5px;margin-top:1px}
.row.rin input{flex:1;min-width:0;background:var(--card);border:0;border-radius:8px;padding:8px 10px;font-size:16px;outline:none;margin:7px 0}
.row:active{background:color-mix(in srgb,var(--mu) 12%,transparent)}
.row.cl{font-size:15px;margin:0}
.grp+textarea.nt,.grp+input.nt,.eb+textarea.nt,.eb+input.nt{margin-top:8px}
.eb .chips{margin-bottom:8px}
#sg-hm{margin:0 0 6px}
/* ===== Export ===== */
.xprev{background:var(--bg);border-radius:12px;padding:2px 14px 6px;max-height:360px;overflow:auto}
.xgh{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--c);margin:14px 0 2px}
.xi{padding:9px 0;border-bottom:.5px solid var(--ln)}.xg .xi:last-child{border-bottom:0}
.xi b{display:block;font-size:15.5px;font-weight:600;line-height:1.3}
.xd{display:block;font-size:13.5px;color:var(--tx);opacity:.8;margin-top:2px}
.xm{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.4}
.xbt{display:flex;gap:8px;margin-top:10px}
.xbt button{flex:1;min-height:42px;border-radius:11px;background:var(--bg);color:var(--ac);font-weight:600;text-align:center}
.xbt .xpri{background:var(--ac);color:#fff}

/* ===== Gabarit commun des lignes (planning + récap) ===== */
.ev .eh .tm,.ln .lt{flex:none;width:52px;min-width:52px;display:flex;flex-direction:column;line-height:1.25}
.ev .eh .tm{font-size:16px;font-weight:700;color:var(--c)}
.ev .eh .tm small,.ln .lt small{font-size:12.5px;font-weight:500;color:var(--mu);margin-top:2px}
.ev .ec,.ln .lc{display:block;font-size:10.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--c);margin-bottom:1px}
.ev .et b{font-size:16px;font-weight:650}
.ev .em2,.ln .ls{font-size:13.5px;color:var(--mu);margin-top:1px;line-height:1.35}
.ev .evt{color:var(--c);font-size:13px;font-weight:600}
.wrow .eh{cursor:default}
.ln{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;border-left:3px solid var(--c);padding:9px 0 9px 10px;margin:6px 0;border-bottom:1px solid var(--ln);border-radius:2px;color:var(--tx)}
.ln .lt b{font-size:16px;font-weight:700;color:var(--c)}
.ln .lt .ld{margin-top:3px}
.ln .lb{flex:1;min-width:0}
.ln .lti{display:block;font-size:16px;font-weight:650;line-height:1.3;word-break:break-word}
.ln .lr{flex:none;color:var(--mu);font-size:20px;line-height:1;align-self:center;padding-right:2px}
.rdh{font-size:15px}
.sdh{font-size:13px;font-weight:600;color:var(--tx);margin:12px 0 0}.sdh:first-of-type{margin-top:4px}

/* ===== Réglages & recherche ===== */
.srch{margin:10px 0 4px}.srch input{width:100%;background:var(--card);border:0;border-radius:12px;padding:11px 14px;font-size:16px;outline:none;box-shadow:var(--sh)}
#rdays .cday:last-child{border-bottom:1px solid var(--ln)}
.cday input[type=time]{background:var(--bg);border:0;border-radius:8px;padding:6px 4px;font-size:15px;width:84px;min-width:0;flex:none}
.cday label{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-weight:600}.cday input[type=checkbox]{width:20px;height:20px}
.rf{display:flex;flex-direction:column;gap:6px;margin-top:12px}.rf span{font-size:13px;color:var(--mu);font-weight:600}
.rf input{background:var(--bg);border:0;border-radius:10px;padding:10px 12px;font-size:16px;outline:none}
.rbt{display:flex;gap:8px;margin-top:12px}.rbt>button,.rbtl{flex:1;min-height:42px;border-radius:11px;background:var(--bg);color:var(--ac);font-weight:600;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.rbtl input{position:absolute;inset:0;opacity:0}
.rbt .xpri{background:var(--ac);color:#fff}
[data-bkx]{background:var(--bg)!important;color:var(--ac)!important}
.grp .row[data-acc]{background:none!important;color:var(--tx)!important}

/* ===== Réglages : horaires ===== */
.wd2{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:.5px solid var(--ln)}
.wd2 .wdn{flex:1;min-width:0;font-weight:600;font-size:15px}
.wd2 .wdt{display:flex;align-items:center;gap:4px;color:var(--mu)}
.wd2 input[type=time]{background:var(--bg);border:0;border-radius:8px;padding:6px 4px;font-size:15px;width:78px;min-width:0}
.offb{flex:none;font-size:12.5px;font-weight:600;padding:6px 9px;border-radius:8px;background:var(--bg);color:var(--mu)}
.wd2.off .wdt{display:none}
.wd2.off .offb{background:color-mix(in srgb,var(--mu) 22%,transparent);color:var(--tx)}
.wd2.off .wdn{color:var(--mu)}
.wd2.one{border-bottom:0;margin-top:6px}
.rdk{flex:none;width:100%;margin-top:2px}
.exl{margin-top:14px}.exr{display:flex;align-items:center;border-bottom:.5px solid var(--ln)}
.exr>button:first-child{flex:1;display:flex;justify-content:space-between;align-items:center;padding:10px 0;text-align:left}
.exr b{font-weight:600;font-size:14.5px;text-transform:capitalize}.exr span{color:var(--mu);font-size:13.5px}
.wdo{display:none;color:var(--mu);font-size:14px}.wd2.off .wdo{display:inline}
.wd2.off .offb{background:color-mix(in srgb,var(--ac) 10%,transparent);color:var(--ac)}

.sw{flex:none;width:44px;height:26px;border-radius:13px;background:color-mix(in srgb,var(--mu) 35%,transparent);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:#34c759}.sw.on::after{transform:translateX(18px)}

.rsel{flex:none;background:none;border:0;color:var(--ac);font-size:15px;font-weight:500;text-align:right;outline:none;-webkit-appearance:none;appearance:none;padding:0}
label.row{cursor:pointer}
.rst{font-size:13.5px;color:var(--mu);margin:10px 2px 0;line-height:1.4}.rst.ok{color:#34c759;font-weight:500}
.card h2.hh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hide{font-size:12px;font-weight:600;color:var(--mu);text-transform:none;letter-spacing:0;padding:2px 0 2px 8px}

.sunin{margin-top:12px;padding-top:12px;border-top:.5px solid var(--ln)}
.sunin .sun div{padding:8px 4px}.sunin .sun b{font-size:17px}
.showb{display:block;margin:10px auto 2px;font-size:12.5px;font-weight:600;color:var(--mu);background:var(--card);border-radius:14px;padding:6px 12px;box-shadow:var(--sh)}

.sst{font-size:15px;font-weight:650;color:var(--tx);margin:2px 0 4px}
.wxa{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13.5px;color:var(--mu)}
.wxa button{color:var(--ac);font-weight:500;font-size:13.5px}.wxa button.on{color:#34c759}
.wxi{display:flex;gap:6px;margin-top:8px}.wxi input{flex:1;min-width:0;background:var(--bg);border:0;border-radius:9px;padding:7px 10px;font-size:16px;outline:none}
.wxi button{color:var(--ac);font-weight:600;font-size:14px;padding:0 6px}
.dsel{display:flex;gap:6px;flex:1 1 140px;min-width:0}
.dsel select{flex:1;min-width:0;background:var(--bg);border:0;border-radius:10px;padding:9px 10px;font-size:16px;color:var(--tx);outline:none}
.dsel input{flex:1;min-width:0;background:var(--bg);border:0;border-radius:10px;padding:9px 10px;font-size:16px;outline:none}
.ef .dsel{display:flex}.ef .dsel select,.ef .dsel input{min-height:44px}

/* ===== Travail : bandeau d'une ligne au-dessus du planning ===== */
.wkb{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;text-align:center;padding:8px 10px;margin:2px 0 8px;border-radius:10px;background:color-mix(in srgb,#007aff 7%,transparent)}
.wkb .wkt{font-weight:600;font-size:14.5px;color:#007aff}
.wkb .wkh{font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.wkb button{font-size:12.5px;font-weight:600;color:var(--ac);padding:0 2px}
.wkb.off{background:color-mix(in srgb,var(--mu) 10%,transparent)}.wkb.off .wkt{color:var(--mu)}
.wked{margin:-2px 0 10px}.wkea{display:flex;justify-content:center;gap:16px;margin-top:6px}.wkea button{font-size:13px;color:var(--ac);font-weight:500}
.wkl{text-align:center;font-size:12.5px;color:var(--mu);margin:4px 0 2px}.wkl span{color:#007aff;font-weight:600}
.wkr{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0}.wkr input{background:var(--bg);border:0;border-radius:8px;padding:7px 8px;font-size:16px;width:104px;color:var(--tx)}.wkr span{color:var(--mu)}
.lgc{justify-content:center}.lgc .chip{margin:0}.lg.lgc{gap:8px}

/* bandeau travail : horaires en gras, bouton discret */
.wkb{position:relative;padding:9px 40px}
.wkb .wkh{font-weight:700;font-size:14.5px;color:#007aff;opacity:.85}
.wkb .wke{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:color-mix(in srgb,#007aff 70%,var(--mu));font-size:17px;padding:0}
.wkb .wke:active{background:color-mix(in srgb,#007aff 12%,transparent)}
/* heure de fin : même typographie que l'heure de début */
.ev .eh .tm small,.ln .lt small:not(.ld){font-size:16px;font-weight:700;color:var(--c);margin-top:1px;opacity:1}

/* météo : contrôles intégrés à l'en-tête */
.hh .wcity{font:inherit;color:var(--ac);letter-spacing:inherit;text-transform:inherit;padding:0;display:inline-flex;align-items:center;gap:3px}
.hh .wcity .chv{display:inline-block;transform:rotate(90deg);font-size:13px;transition:transform .2s}.hh .wcity .chv.up{transform:rotate(-90deg)}
.hha{display:flex;align-items:center;gap:10px}
.geoi{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mu);background:var(--bg)}
.geoi.on{color:#fff;background:#34c759}
.wxi{margin:-2px 0 10px}
#gmsg:empty{display:none}
/* heures alignées */
.ev .eh .tm,.ln .lt,.wkb .wkh{font-variant-numeric:tabular-nums}
a.chip{text-decoration:none}

/* ===== Récap (semaine / mois) ===== */
.rday{display:flex;gap:12px;padding:12px 0;border-bottom:.5px solid var(--ln)}
.rday:last-child{border-bottom:0}.rday:first-child{padding-top:4px}
.rdd{flex:none;width:44px;display:flex;flex-direction:column;align-items:center;padding-top:2px;color:var(--tx)}
.rdd span{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--mu)}
.rdd b{font-size:22px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.rday.today .rdd b{color:#fff;background:var(--ac);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-top:2px}
.rday.today .rdd span{color:var(--ac)}
.rdb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:2px}
.rtags{display:flex;flex-wrap:wrap;gap:6px}
.rtag{font-size:12.5px;color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:7px;padding:3px 8px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rtag b{font-weight:600}
.rev{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;background:var(--bg);border-left:3px solid var(--c);color:var(--tx)}
.rev .rt{flex:none;width:44px;display:flex;flex-direction:column;font-weight:700;font-size:14.5px;color:var(--c);line-height:1.25;font-variant-numeric:tabular-nums}
.rev .rt i{font-style:normal}
.rev .rn{flex:1;min-width:0;display:flex;flex-direction:column}
.rev .rn b{font-size:15px;font-weight:650;line-height:1.3;word-break:break-word}
.rev .rn small{font-size:12.5px;color:var(--mu);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rev .rn em{font-style:normal;color:var(--c);font-weight:600}
.rev .rc{flex:none;color:var(--mu);font-size:18px}
.rnone{font-size:13px;color:var(--mu);padding-top:6px}

/* rendez-vous du récap : lignes épurées */
.rev{background:none;border:0;border-left:0;border-radius:0;padding:4px 0;gap:12px;align-items:flex-start}
.rev .rt{width:auto;flex-direction:row;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--tx);padding-top:1px;min-width:108px}
.rev .rt u{display:block;width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;text-decoration:none}
.rev .rt i{font-style:normal;color:var(--mu);font-weight:500}
.rev .rt i::before{content:"–";margin:0 4px;color:var(--mu)}
.rev .rn b{font-size:15px;font-weight:600}
.rev .rn small{color:var(--mu)}
.rev:active{opacity:.6}
.rdb{gap:4px}.rtags{margin-bottom:2px}

.rev .rt{flex-direction:column;align-items:flex-start;gap:0;min-width:0;width:46px;font-size:14.5px;font-weight:650;line-height:1.3;padding-top:0}
.rev .rt i{font-weight:500;font-size:13.5px}.rev .rt i::before{content:none}
.rev .rn small{display:flex;align-items:center;gap:5px}
.rev .rn small u{display:block;width:6px;height:6px;border-radius:50%;background:var(--c);flex:none;text-decoration:none}
.rev{padding:5px 0}

/* ===== Ligne de rendez-vous unifiée : horaires – type – intitulé ===== */
.hl{display:block;font-size:15.5px;line-height:1.38;color:var(--tx);word-break:break-word;text-align:left}
.hl .hh{font-weight:700;color:var(--c);font-variant-numeric:tabular-nums;white-space:nowrap}
.hl .hc{font-weight:600;color:var(--c)}
.hl>i{font-style:normal;color:var(--mu);margin:0 5px;font-weight:400}
.hl b.hx,.ev .et .hl b.hx{display:inline;font-size:inherit;font-weight:600;color:var(--tx);line-height:inherit}
.hsub{display:block;font-size:13px;color:var(--mu);margin-top:2px;line-height:1.35}
.ev .et .em2{margin-top:2px}
.ln{border-left:0;padding:10px 0;margin:0;border-radius:0;align-items:center}
.ln .ls{margin-top:2px}
.rev .rn small{display:block;margin-top:1px}
.it .t .hl{font-size:15px}

/* ===== À venir : tâches repliées ===== */
.sdh{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px}
.stk0{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding-top:8px;font-size:14px;color:var(--mu)}
.stk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--mu);padding:2px 2px 2px 8px;border-radius:999px}

<div style="text-align:center;margin:20px 0 24px"><img src="icon-180.png" alt="" style="width:76px;height:76px;border-radius:18px"><h1 style="margin:12px 0 4px">Mon emploi du temps</h1><p class="sub" id="asub">Connecte-toi pour retrouver ton planning.</p></div>
<div class="af" id="aform">
<input type="email" id="aem" placeholder="Adresse mail" autocomplete="email" inputmode="email" autocapitalize="off">
<input type="password" id="apw" placeholder="Mot de passe (6 caractères min.)" autocomplete="current-password">
<button class="pri" id="ago">Se connecter</button>
<div class="amsg" id="amsg"></div>
<button class="lnk" id="asw">Pas encore de compte ? Créer un compte</button>
<button class="lnk" id="afg" style="color:var(--mu);font-size:14px">Mot de passe oublié ?</button>
</div>
<div class="af" id="anew" hidden>
<input type="password" id="anp" placeholder="Nouveau mot de passe" autocomplete="new-password">
<button class="pri" id="ansave">Enregistrer le mot de passe</button>
<div class="amsg" id="anmsg"></div>
</div>
</div></div>
<div id="cfgo" hidden><div class="box">
<h1 style="margin:10px 0 4px">Tes horaires</h1><p class="sub">Coche tes jours de travail et indique tes horaires habituels. Tu pourras toujours modifier un jour précis dans l’appli.</p>
<div class="card" id="cdays"></div>
<div class="card"><h2>Ta ville (pour la météo)</h2><div class="af"><input type="text" id="ccity" placeholder="Ex. Paris" style="background:var(--bg)"></div></div>
<div class="af"><button class="pri" id="csave">Enregistrer</button><div class="amsg" id="cmsg"></div></div>
</div></div>
<script>
(function(){
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{storageKey:'edt-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
window.SB=sb;
const show=(id,on)=>{const e=document.getElementById(id);if(e)e.hidden=!on};
let mode='in';
const am=(t,err)=>{const m=$('#amsg');m.textContent=t||'';m.className='amsg'+(err?' err':'')};
const frErr=e=>{const m=(e&&e.message)||'';if(/Invalid login/i.test(m))return 'Adresse mail ou mot de passe incorrect.';if(/not confirmed/i.test(m))return 'Ton adresse mail n’est pas encore confirmée : ouvre le lien reçu par mail.';if(/already registered|already been registered/i.test(m))return 'Un compte existe déjà avec cette adresse : connecte-toi.';if(/at least 6|Password should/i.test(m))return 'Le mot de passe doit faire au moins 6 caractères.';if(/rate limit/i.test(m))return 'Trop de tentatives, réessaie dans quelques minutes.';if(/invalid.*email|Unable to validate email/i.test(m))return 'Adresse mail invalide.';if(/fetch|network/i.test(m))return 'Pas de connexion Internet.';return m||'Une erreur est survenue.'};
const setMode=m=>{mode=m;$('#ago').textContent=m==='in'?'Se connecter':'Créer mon compte';$('#asw').textContent=m==='in'?'Pas encore de compte ? Créer un compte':'Déjà un compte ? Se connecter';$('#apw').autocomplete=m==='in'?'current-password':'new-password';$('#afg').hidden=m!=='in';am('')};
$('#asw').onclick=()=>setMode(mode==='in'?'up':'in');
const back=location.origin+location.pathname;
$('#ago').onclick=async()=>{const email=$('#aem').value.trim(),password=$('#apw').value;if(!email||!password){am('Renseigne ton adresse mail et un mot de passe.',1);return}
  $('#ago').disabled=true;am(mode==='in'?'Connexion…':'Création du compte…');
  try{if(mode==='in'){const{error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;location.replace(back);return}
    const{data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:back}});if(error)throw error;
    if(data&&data.session){location.replace(back);return}
    if(data&&data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length){am('Un compte existe déjà avec cette adresse : connecte-toi.',1);setMode('in');return}
    am('Compte créé ✓ Un mail de confirmation t’a été envoyé : ouvre le lien qu’il contient, puis reviens te connecter ici.');setMode('in');
  }catch(e){am(frErr(e),1)}finally{$('#ago').disabled=false}};
$('#apw').onkeydown=e=>{if(e.key==='Enter')$('#ago').click()};
$('#afg').onclick=async()=>{const email=$('#aem').value.trim();if(!email){am('Écris d’abord ton adresse mail ci-dessus.',1);return}
  try{const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:back});if(error)throw error;am('Si un compte existe, un mail pour changer ton mot de passe vient d’être envoyé.')}catch(e){am(frErr(e),1)}};
$('#ansave').onclick=async()=>{const p=$('#anp').value,m=$('#anmsg');if(p.length<6){m.textContent='Au moins 6 caractères.';return}
  const{error}=await sb.auth.updateUser({password:p});if(error){m.textContent=frErr(error);return}m.textContent='Mot de passe modifié ✓';setTimeout(()=>location.replace(back),900)};

/* --- réglages : jours, horaires, ville --- */
const JL=[[1,'Lundi'],[2,'Mardi'],[3,'Mercredi'],[4,'Jeudi'],[5,'Vendredi'],[6,'Samedi'],[0,'Dimanche']];
window.openCfg=()=>{const w=(S.cfg&&S.cfg.w)||(S.cfg?{}:{1:['09:00','17:00'],2:['09:00','17:00'],3:['09:00','17:00'],4:['09:00','17:00'],5:['09:00','17:00']});
  $('#cdays').innerHTML=JL.map(([d,n])=>{const on=!!w[d],v=w[d]||['09:00','17:00'];return '<div class="cday'+(on?'':' off')+'" data-d="'+d+'"><label><input type="checkbox"'+(on?' checked':'')+'> '+n+'</label><input type="time" value="'+v[0]+'"> <span style="color:var(--mu)">–</span> <input type="time" value="'+v[1]+'"></div>'}).join('');
  $('#cdays').querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>c.closest('.cday').classList.toggle('off',!c.checked));
  $('#ccity').value=(S.cfg&&S.cfg.city)||S.city||'';$('#cmsg').textContent='';show('cfgo',1)};
$('#csave').onclick=()=>{const w={};let bad=0;$('#cdays').querySelectorAll('.cday').forEach(r=>{const c=r.querySelector('input[type=checkbox]'),t=r.querySelectorAll('input[type=time]');if(c.checked){if(!t[0].value||!t[1].value)bad=1;w[r.dataset.d]=[t[0].value,t[1].value]}});
  if(bad){$('#cmsg').textContent='Indique une heure de début et de fin pour chaque jour coché.';return}
  const city=$('#ccity').value.trim();if(!city){$('#cmsg').textContent='Indique ta ville.';return}
  S.cfg={w,city};if(city!==S.city){S.city=city;S.auto=0}applyCfg();save();render();show('cfgo',0)};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-acc]');if(!b)return;
  if(b.dataset.acc==='cfg')openCfg();
  else if(b.dataset.acc==='del'){const en=S.lang==='en';if(!confirm(en?'Delete your account permanently? Your schedule and attachments will be erased.':'Supprimer définitivement ton compte ? Ton planning et tes pièces jointes seront effacés.'))return;if(!confirm(en?'This cannot be undone. Continue?':'Cette action est irréversible. Continuer ?'))return;
    try{const r=await sb.storage.from('files').list(UID,{limit:1000});const L=(r&&r.data)||[];if(L.length)await sb.storage.from('files').remove(L.map(f=>UID+'/'+f.name));const{error}=await sb.rpc('delete_my_account');if(error)throw error}catch(er){alert(en?'Deletion failed, please try again later.':'La suppression a échoué, réessaie plus tard.');return}
    try{await sb.auth.signOut()}catch(er){}try{localStorage.removeItem(LSK);localStorage.removeItem('edt-auth');indexedDB.deleteDatabase('edt-files')}catch(er){}location.replace(back)}
  else if(b.dataset.acc==='out'){if(!confirm('Se déconnecter ? Tes données restent enregistrées dans ton compte.'))return;try{await sb.auth.signOut()}catch(er){}try{localStorage.removeItem(LSK);localStorage.removeItem('edt-auth')}catch(er){}location.replace(back)}});

/* --- synchronisation --- */
let pushing=null,again=false;
const push=async()=>{if(!UID)return;if(pushing){again=true;return}pushing=1;try{await sb.from('user_data').upsert({user_id:UID,data:S,updated_at:new Date().toISOString()})}catch(e){}pushing=null;if(again){again=false;push()}};
window.__push=push;
const norm=()=>{S.g=Object.assign({m:[],j:[],a:[],p:[],c:[],k:[],v:[]},S.g||{});S.vac=S.vac||[];S.dates=S.dates||[];S.days=S.days||{}};
const pull=async()=>{try{const{data,error}=await sb.from('user_data').select('data').eq('user_id',UID).maybeSingle();if(error)throw error;
    const r=data&&data.data;
    if(r&&(r.ts||0)>(S.ts||0)){S=r;norm();try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}mig();render();return 1}
    if(S.ts&&(!r||(r.ts||0)<S.ts))push();return 1}catch(e){return 0}};

/* --- fichiers joints : copie dans le compte --- */
const _fput=fput,_fget=fget,_fdel=fdel,fp=id=>UID+'/'+id;
fput=async(id,b)=>{await _fput(id,b);if(UID)sb.storage.from('files').upload(fp(id),b,{upsert:true,contentType:b.type||'application/octet-stream'}).catch(()=>{})};
fget=async id=>{let b=null;try{b=await _fget(id)}catch(e){}if(!b&&UID){try{const r=await sb.storage.from('files').download(fp(id));if(r&&r.data){b=r.data;_fput(id,b).catch(()=>{})}}catch(e){}}return b};
fdel=async id=>{await _fdel(id);if(UID)sb.storage.from('files').remove([fp(id)]).catch(()=>{})};

/* --- démarrage --- */
sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='PASSWORD_RECOVERY'){show('auth',1);show('aform',0);show('anew',1);$('#asub').textContent='Choisis un nouveau mot de passe.'}});
(async()=>{let ses=null;try{ses=(await sb.auth.getSession()).data.session}catch(e){}
  if(location.hash&&/type=recovery/.test(location.hash))return;
  if(!ses){if(UID&&!navigator.onLine){start();return}show('auth',1);return}
  if(ses.user.id!==UID){location.replace(back);return}
  if(location.hash||location.search)history.replaceState(null,'',back);
  UEMAIL=ses.user.email||UEMAIL;start()})();
async function start(){show('auth',0);render();await pull();if(!S.cfg)openCfg()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&UID&&navigator.onLine)pull()});
})();
</script>

</body>
</html>
